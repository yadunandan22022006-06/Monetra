spring.application.name=monetra
server.port=${PORT:8081}
# Online (Render), the app runs behind a proxy: use the public https address it reports, so the
# PayPal return link points back to the real site instead of the inner address.
server.forward-headers-strategy=framework

# Email OTP for registration (optional: judges can use the demo accounts instead)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MONETRA_MAIL_USERNAME:}
spring.mail.password=${MONETRA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Local development only: when email is not set up (or fails), print the OTP in the server console.
monetra.log-otp=${MONETRA_LOG_OTP:false}

# PayPal Sandbox (set these as environment variables, never in this file)
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=https://api-m.sandbox.paypal.com
# Id of the webhook you create in the PayPal developer dashboard (URL: https://your-server/api/paypal/webhook)
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# Setu Account Aggregator (My bank accounts, Check Balance). Sandbox by default: test accounts, not a real bank.
# The keys come from the start script and never reach the browser.
setu.aa.client-id=${SETU_AA_CLIENT_ID:}
setu.aa.client-secret=${SETU_AA_CLIENT_SECRET:}
setu.aa.product-instance-id=${SETU_AA_PRODUCT_INSTANCE_ID:}
setu.aa.base-url=${SETU_AA_BASE_URL:https://fiu-sandbox.setu.co}
setu.aa.token-url=${SETU_AA_TOKEN_URL:https://orgservice-prod.setu.co/v1/users/login}
# A consent allows at most one data request an hour, so a balance is fetched at most this often.
setu.aa.min-refresh-minutes=${SETU_AA_MIN_REFRESH_MINUTES:60}

# AI Guardian (optional). Use ONE of these:
#  1. A FREE AI that speaks the OpenAI chat format: Google Gemini (free tier), Groq (free tier) or Ollama on this computer.
#     Set AI_BASE_URL, AI_MODEL and AI_API_KEY (no key needed for Ollama). Examples are in the README.
#  2. Claude (paid): set ANTHROPIC_API_KEY.
# AI_PROVIDER can be "openai" or "anthropic" to force one. Leave it empty to choose automatically.
ai.provider=${AI_PROVIDER:}
ai.base-url=${AI_BASE_URL:}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:}
# An AI on this computer (Ollama) that answers only when the online AI cannot be reached. Empty: none.
ai.fallback-base-url=${AI_FALLBACK_BASE_URL:}
ai.fallback-model=${AI_FALLBACK_MODEL:}
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Demo accounts with sample data, so the app can be tried without email OTP.
# Set MONETRA_SEED_DEMO_USERS=true to create them (see README).
monetra.seed-demo-users=${MONETRA_SEED_DEMO_USERS:false}
monetra.demo-password=${MONETRA_DEMO_PASSWORD:MonetraDemo#2026}

# Saved data (H2 file database in ./data)
spring.datasource.url=${MONETRA_DB_URL:jdbc:h2:file:./data/monetra}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Static files: always check for a newer version, so style and script updates show up right away
spring.web.resources.cache.cachecontrol.no-cache=true

# Login session cookie
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# true when the site is served over https (online), so the cookie is never sent over plain http
server.servlet.session.cookie.secure=${MONETRA_COOKIE_SECURE:false}
