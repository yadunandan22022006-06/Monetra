spring.application.name=monetra
server.port=${PORT:8081}

# Email OTP for registration (optional: judges can use the demo accounts instead)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MONETRA_MAIL_USERNAME:}
spring.mail.password=${MONETRA_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Local development only: when email is not set up (or fails), print the OTP in the server console.
monetra.log-otp=${MONETRA_LOG_OTP:false}

# PayPal Sandbox (set these as environment variables, never in this file)
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.base-url=https://api-m.sandbox.paypal.com
# Id of the webhook you create in the PayPal developer dashboard (URL: https://your-server/api/paypal/webhook)
paypal.webhook-id=${PAYPAL_WEBHOOK_ID:}

# AI Guardian (optional). Use ONE of these:
#  1. A FREE AI that speaks the OpenAI chat format: Google Gemini (free tier), Groq (free tier) or Ollama on this computer.
#     Set AI_BASE_URL, AI_MODEL and AI_API_KEY (no key needed for Ollama). Examples are in the README.
#  2. Claude (paid): set ANTHROPIC_API_KEY.
# AI_PROVIDER can be "openai" or "anthropic" to force one. Leave it empty to choose automatically.
ai.provider=${AI_PROVIDER:}
ai.base-url=${AI_BASE_URL:}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:}
anthropic.api-key=${ANTHROPIC_API_KEY:}

# Demo accounts with sample data, so the app can be tried without email OTP.
# Set MONETRA_SEED_DEMO_USERS=true to create them (see README).
monetra.seed-demo-users=${MONETRA_SEED_DEMO_USERS:false}
monetra.demo-password=${MONETRA_DEMO_PASSWORD:MonetraDemo#2026}

# Saved data (H2 file database in ./data)
spring.datasource.url=${MONETRA_DB_URL:jdbc:h2:file:./data/monetra}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Static files: always check for a newer version, so style and script updates show up right away
spring.web.resources.cache.cachecontrol.no-cache=true

# Login session cookie
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
