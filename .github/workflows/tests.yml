name: Tests

# Runs the whole test suite on GitHub's servers for every upload to main and every pull request.
# It uses no keys or secrets: the tests use fake PayPal, Setu and AI servers.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the tests
        run: ./mvnw -B -q test
